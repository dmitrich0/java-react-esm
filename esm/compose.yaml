# Only the backend runs here. PostgreSQL is external (Supabase or another host).
services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    image: esm-backend:local
    env_file:
      - path: ./.env.docker
        format: raw
    environment:
      PORT: "8080"
    ports:
      - "127.0.0.1:8080:8080"
    restart: unless-stopped
    stop_grace_period: 30s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
