# Local development only. Production databases are configured via DB_*.
services:
  postgres:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_DB: esm
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d esm"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
