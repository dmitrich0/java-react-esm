spring.application.name=esm
spring.config.import=optional:file:./.env[.properties]

server.address=0.0.0.0
server.port=${PORT:8080}
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s

management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:5}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:1}

spring.flyway.locations=classpath:db/migration
spring.flyway.default-schema=esm
spring.flyway.schemas=esm
spring.flyway.create-schemas=true
spring.flyway.clean-disabled=true
spring.flyway.baseline-on-migrate=false

spring.jpa.properties.hibernate.default_schema=esm
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.web.error.include-message=always
